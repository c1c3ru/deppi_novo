<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <!--
      Aplica o tema em <html> antes do primeiro paint. O padrão é sempre o
      claro; o escuro só vale se a pessoa escolheu no botão de tema. Mantém a
      mesma chave do ThemeService (core/services/theme.service.ts). Se este
      script mudar, recalcule o hash dele no Content-Security-Policy do nginx.conf.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('theme-preference') === 'dark') {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>Deppi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
