# Análise estática opcional com SonarQube.
#
# O workflow só executa a análise quando o repositório tem os três valores
# configurados abaixo. Enquanto faltar qualquer um deles, o job termina verde
# com um aviso explicando o que falta, em vez de falhar em todo push e em todo
# pull request com "This GitHub Action requires the SONAR_TOKEN env variable".
#
# Para ligar a análise (Settings > Secrets and variables > Actions):
#   1. Secret  SONAR_TOKEN        — token gerado no SonarQube em My Account > Security.
#   2. Secret  SONAR_HOST_URL     — URL da instância do SonarQube.
#   3. Variable SONAR_PROJECT_KEY — chave do projeto, em Project Information.
#
# Documentação: https://docs.sonarsource.com/sonarqube-server/latest/devops-platform-integration/github-integration/

name: SonarQube analysis

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # permite ao SonarQube comentar o resultado nos PRs

jobs:
  Analysis:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Verificar configuração do SonarQube
        id: check
        run: |
          missing=""
          if [ -z "$SONAR_TOKEN" ]; then missing="$missing SONAR_TOKEN"; fi
          if [ -z "$SONAR_HOST_URL" ]; then missing="$missing SONAR_HOST_URL"; fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then missing="$missing SONAR_PROJECT_KEY"; fi
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Análise do SonarQube pulada::Faltam:$missing. Veja as instruções no topo de .github/workflows/sonarqube.yml."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # O scanner roda em cima do workspace, então o código precisa estar nele.
      # fetch-depth 0 traz o histórico completo, que o SonarQube usa para
      # atribuir cada problema ao commit que o introduziu.
      - name: Checkout code
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarQube
        if: steps.check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # usado para identificar o PR analisado
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
